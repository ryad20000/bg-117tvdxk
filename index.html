function addPay(i){form(t('addpay'),[['amt',t('amt'),'n'],['me',t('method'),'s',[['cash',t('cash')],['tr',t('tr')],['chq',t('chq')]]],['date',t('date'),'d',0,today()]],r=>D.payments.push({id:uid(),pid:i,amt:r.amt,me:r.me,date:r.date}))}
function addExp(i){form(t('addexp'),[['amt',t('amt'),'n'],['cat',t('cat'),'s',CS()],['note',t('note'),'t'],['pid',t('proj1'),'s',PS(),i||''],['unpaid',t('unpaid'),'s',YN(),0],['date',t('date'),'d',0,today()]],r=>D.expenses.push({id:uid(),amt:r.amt,cat:r.cat,note:r.note,pid:r.pid,unpaid:+r.unpaid,date:r.date}))}
function addDay(i){if(!D.workers.length){alert(t('neww'));return}form(t('addday'),[['wid',t('worker'),'s',D.workers.map(w=>[w.id,w.name])],['n',t('days'),'n',0,1],['date',t('date'),'d',0,today()]],r=>D.days.push({id:uid(),pid:i,wid:r.wid,n:r.n,wage:(D.workers.find(w=>w.id==r.wid)||{}).wage||0,date:r.date}))}
function mvPick(i){if(!D.materials.length){alert(t('newm'));return}form(t('usemat'),[['m',t('mat'),'s',D.materials.map(m=>[m.id,m.name+' ('+qty(m)+')'])]],r=>{setTimeout(()=>mv(r.m,'use',i),50)})}
function mv(mid,type,i){const m=D.materials.find(x=>x.id==mid);const f=[['q',t('qty')+' ('+m.unit+')','n']];
if(type=='buy'){f.push(['pr',t('price'),'n',0,m.price],['un',t('supp'),'s',YN(),0])}if(type=='use'||type=='return')f.push(['pid',t('proj1'),'s',PS().slice(1),i||(D.projects[0]||{}).id]);
if(type=='dmg')f.push(['why',t('reason'),'s',['r1','r2','r3','r4'].map(k=>[k,t(k)])]);f.push(['date',t('date'),'d',0,today()]);
form(m.name+' — '+t(type),f,r=>{if(type=='buy')m.price=r.pr||m.price;D.moves.push({id:uid(),mid,type,q:r.q,cost:r.q*m.price,pid:r.pid,why:r.why,unpaid:+r.un||0,date:r.date})})}
V.stock=()=>`<button class="b" onclick="addM()">+ ${t('newm')}</button>`+(D.materials.map(m=>{const q=qty(m);return `<div class="card"><b>${esc(m.name)}</b> <span class="${m.min&&q<=m.min?'neg':''}">${q} ${esc(m.unit)}</span> <small>· ${money(m.price)}</small><div class="row">${['buy','use','dmg','ret'].map(k=>`<button class="b s" onclick="mv('${m.id}','${k}')">${t(k)}</button>`).join('')}<a onclick="rm('materials','${m.id}')" style="padding:12px">🗑</a></div></div>`}).join('')||`<p>${t('none')}</p>`)+TL();
const dayd=d=>Math.max(0,Math.floor((Date.now()-new Date(d))/864e5)),tname=x=>x.from?((D.partners.find(a=>a.id==x.from)||{}).name||'—'):(x.who||'—');
function TL(){const o=D.tools.filter(x=>x.k=='own'),b=D.tools.filter(x=>x.k=='borr'&&!x.ret),rb=D.tools.filter(x=>x.k=='borr'&&x.ret);
return `<h3 style="margin-top:18px">🛠 ${t('tools')}</h3><button class="b" onclick="addT()">+ ${t('newtool')}</button>
<div class="card"><b>${t('own')}</b> · ${money(sum(o,x=>x.val))}${o.map(x=>`<div class="li"><span>${esc(x.name)}<br><small>${esc(x.note||'')}</small></span><span>${money(x.val)} <a onclick="editV('${x.id}')">✎</a> <a onclick="rm('tools','${x.id}')">✕</a></span></div>`).join('')||`<br><small>${t('none')}</small>`}</div>
<div class="card"><b>${t('borr')}</b>${b.map(x=>`<div class="li"><span>${esc(x.name)}<br><small>${t('from')}: ${esc(tname(x))} · ${x.date} · ${dayd(x.date)} ${t('dayss')}</small></span><span><a onclick="retT('${x.id}')">${t('retd')}</a> <a onclick="rm('tools','${x.id}')">✕</a></span></div>`).join('')||`<br><small>${t('none')}</small>`}${rb.map(x=>`<div class="li"><span>${esc(x.name)}<br><small>${esc(tname(x))} · ${x.date} → ${x.ret}</small></span><span>✓ <a onclick="rm('tools','${x.id}')">✕</a></span></div>`).join('')}</div>`}
function addT(){form(t('newtool'),[['k',t('tk'),'s',[['own',t('own')],['borr',t('borr')]]],['name',t('name'),'t'],['val',t('tval'),'n'],['from',t('from'),'s',[['',t('other')]].concat(D.partners.map(a=>[a.id,a.name]))],['who',t('who'),'t'],['date',t('since'),'d',0,today()],['note',t('note'),'t'],['buy',t('boughtnow'),'s',YN(),0]],r=>{D.tools.push({id:uid(),k:r.k,name:r.name,val:r.val,from:r.from,who:r.who,date:r.date,note:r.note});if(r.k=='own'&&+r.buy&&r.val)D.expenses.push({id:uid(),amt:r.val,cat:'tool',note:r.name,pid:'',unpaid:0,date:r.date})})}
function editV(id){const x=D.tools.find(y=>y.id==id);form(x.name,[['val',t('tval'),'n',0,x.val],['note',t('note'),'t',0,x.note]],r=>{x.val=r.val;x.note=r.note})}
function retT(id){D.tools.find(y=>y.id==id).ret=today();save();render()}
function AS(){const o=D.tools.filter(x=>x.k=='own'),st=D.materials.map(m=>({m,q:qty(m),v:Math.max(0,qty(m))*m.price})),tv=sum(o,x=>x.val),sv=sum(st,x=>x.v);
return `<div class="card"><h3>${t('assets')}: ${money(tv+sv)}</h3><div class="li"><b>${t('tools')}</b><b>${money(tv)}</b></div>${o.map(x=>`<div class="li"><span>${esc(x.name)}</span><span>${money(x.val)}</span></div>`).join('')}<div class="li"><b>${t('sv')}</b><b>${money(sv)}</b></div>${st.map(q=>`<div class="li"><span>${esc(q.m.name)} · ${q.q} ${esc(q.m.unit)} × ${money(q.m.price)}</span><span>${money(q.v)}</span></div>`).join('')}</div>`}
function addM(){form(t('newm'),[['name',t('name'),'t'],['unit',t('unit'),'t'],['pr',t('price'),'n'],['min',t('min'),'n'],['q',t('qty'),'n'],['date',t('date'),'d',0,today()]],r=>{const m={id:uid(),name:r.name,unit:r.unit,price:r.pr,min:r.min};D.materials.push(m);if(r.q>0)D.moves.push({id:uid(),mid:m.id,type:'buy',q:r.q,cost:r.q*r.pr,date:r.date})})}
function debts(){return D.expenses.filter(x=>x.unpaid).map(x=>({k:'expenses',x,amt:x.amt,l:cat(x.cat)+' '+(x.note||'')})).concat(D.moves.filter(x=>x.unpaid&&x.type=='buy').map(x=>({k:'moves',x,amt:x.cost,l:mn(x.mid)})))}
function settle(k,id){const x=D[k].find(y=>y.id==id);x.unpaid=0;x.date=today();save();render()}
V.money=()=>`<div class="row"><button class="b" onclick="addExp()">${t('addexp')}</button><button class="b g" onclick="addWd()">${t('wd')}</button></div>
<div class="card"><h3>${t('debts')}</h3>${debts().map(d=>`<div class="li"><span>${esc(d.l)} · ${money(d.amt)}</span><a onclick="settle('${d.k}','${d.x.id}')">${t('settle')}</a></div>`).join('')||t('none')}</div>
<div class="card"><h3>${t('expl')}</h3>${D.expenses.slice(-30).reverse().map(x=>`<div class="li"><span>${x.date} · ${cat(x.cat)} ${esc(x.note||'')} · ${money(x.amt)}${x.unpaid?' ⏳':''}</span><a onclick="rm('expenses','${x.id}')">✕</a></div>`).join('')||t('none')}</div>
<div class="card"><h3>${t('wds')}</h3>${D.wd.slice(-15).reverse().map(x=>`<div class="li"><span>${x.date} · ${money(x.amt)}</span><a onclick="rm('wd','${x.id}')">✕</a></div>`).join('')||t('none')}</div>`;
function addWd(){form(t('wd'),[['amt',t('amt'),'n'],['date',t('date'),'d',0,today()]],r=>D.wd.push({id:uid(),amt:r.amt,date:r.date}))}
V.ppl=()=>`<div class="row"><button class="b" onclick="addC()">+ ${t('newc')}</button><button class="b g" onclick="addW()">+ ${t('neww')}</button></div>
<div class="card"><h3>${t('client')}</h3>${D.clients.map(c=>`<div class="li"><span>${esc(c.name)} <small>${esc(c.phone||'')}</small></span><span>${c.phone?`<a href="tel:${esc(c.phone)}">📞</a> <a href="https://wa.me/${esc(String(c.phone).replace(/\D/g,'').replace(/^0/,'213'))}">💬</a>`:''}</span></div>`).join('')||t('none')}</div>
${PT()}<div class="card"><h3>${t('worker')}</h3>${D.workers.map(w=>{const b=sum(D.days.filter(x=>x.wid==w.id),x=>x.wage*x.n)-sum(D.wpay.filter(x=>x.wid==w.id),x=>x.amt);return `<div class="li"><span>${esc(w.name)} · ${money(w.wage)}<br><small>${t('bal')}: <b class="${b>0?'neg':''}">${money(b)}</b></small></span><span><a onclick="payW('${w.id}')">${t('payw')}</a></span></div>`}).join('')||t('none')}</div>`;
const SG={pk1:1,pk2:-1,pk3:-1,pk4:1,pk5:-1,pk6:1},pbal=id=>sum(D.pl.filter(x=>x.ptn==id),x=>x.s*x.amt);
function PT(){return `<div class="card"><h3>🤝 ${t('part')}</h3><div class="row"><button class="b s" onclick="addPt()">+ ${t('newpt')}</button><button class="b s" onclick="addPl()">+ ${t('pent')}</button></div>${D.partners.map(a=>{const b=pbal(a.id);return `<div class="li"><span>${esc(a.name)}<br><small>${b>0?t('owesme'):b<0?t('iowe'):'✓'} <b class="${b>=0?'pos':'neg'}">${money(Math.abs(b))}</b></small></span><span><a onclick="plist('${a.id}')">${t('hist')}</a></span></div>`}).join('')||t('none')}</div>`}
function addPt(){form(t('newpt'),[['name',t('name'),'t'],['phone',t('phone'),'t']],r=>D.partners.push({id:uid(),name:r.name,phone:r.phone}))}
function addPl(){if(!D.partners.length){alert(t('newpt'));return}form(t('pent'),[['ptn',t('part'),'s',D.partners.map(a=>[a.id,a.name])],['k',t('type'),'s',Object.keys(SG).map(k=>[k,t(k)])],['amt',t('amt'),'n'],['pid',t('proj1'),'s',PS()],['note',t('note'),'t'],['date',t('date'),'d',0,today()]],r=>D.pl.push({id:uid(),ptn:r.ptn,k:r.k,s:SG[r.k],amt:r.amt,pid:r.pid,note:r.note,date:r.date}))}
function plist(id){M(`<h3>${esc((D.partners.find(a=>a.id==id)||{}).name)}</h3>`+D.pl.filter(x=>x.ptn==id).slice().reverse().map(x=>`<div class="li"><span>${x.date} · ${t(x.k)} · ${money(x.amt)}<br><small>${esc((D.projects.find(p=>p.id==x.pid)||{}).title||'')} ${esc(x.note||'')}</small></span><a onclick="if(confirm(t('del'))){D.pl=D.pl.filter(y=>y.id!='${x.id}');save();plist('${id}')}">✕</a></div>`).join('')+`<button class="b g" onclick="closeM()">${t('close')}</button>`)}
function addC(){form(t('newc'),[['name',t('name'),'t'],['phone',t('phone'),'t']],r=>D.clients.push({id:uid(),name:r.name,phone:r.phone}))}
function addW(){form(t('neww'),[['name',t('name'),'t'],['wage',t('wage'),'n']],r=>D.workers.push({id:uid(),name:r.name,wage:r.wage}))}
function payW(id){form(t('payw'),[['amt',t('amt'),'n'],['date',t('date'),'d',0,today()]],r=>D.wpay.push({id:uid(),wid:id,amt:r.amt,date:r.date}))}
V.more=()=>{let h='';const ms6=[];for(let i=0;i<6;i++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);ms6.push(d.toISOString().slice(0,7))}
const rows=ms6.map(m=>[m,ms(m)]),mx=Math.max(1,...rows.map(r=>Math.max(r[1].inc,r[1].ex)));
h+=`<div class="card"><h3>${t('rep')}</h3>${rows.map(([m,s])=>`<div style="margin:8px 0"><small>${m}</small> <span class="pos">${money(s.inc)}</span> / <span class="neg">${money(s.ex)}</span><div class="bar" style="width:${s.inc/mx*100}%;background:var(--g)"></div><div class="bar" style="width:${s.ex/mx*100}%;background:var(--r)"></div></div>`).join('')}</div>`;
const bc={};D.expenses.filter(x=>ms6.includes(mon(x.date))).forEach(x=>bc[x.cat]=(bc[x.cat]||0)+x.amt);const bs=sum(D.moves.filter(x=>x.type=='buy'&&ms6.includes(mon(x.date))),x=>x.cost);if(bs)bc.stock=bs;const tot=sum(Object.values(bc))||1;
h+=`<div class="card"><h3>${t('bymat')}</h3>${Object.entries(bc).map(([k,v])=>`<div style="margin:6px 0">${k=='stock'?t('stock'):cat(k)} · ${money(v)} (${Math.round(v/tot*100)}%)<div class="bar" style="width:${v/tot*100}%"></div></div>`).join('')||t('none')}</div>`;
const ls={};D.moves.filter(x=>x.type=='dmg').forEach(x=>ls[x.mid]=(ls[x.mid]||0)+x.cost);
h+=`<div class="card"><h3>${t('loss')}: ${money(sum(Object.values(ls)))}</h3>${Object.entries(ls).map(([k,v])=>`<div class="li"><span>${esc(mn(k))}</span><span class="neg">${money(v)}</span></div>`).join('')}</div>`;
h+=AS();h+=`<div class="card"><h3>${t('pw')}</h3>${D.projects.map(p=>`<div class="li"><span>${esc(p.title)}</span><b class="${p.price-cost(p)>=0?'pos':'neg'}">${money(p.price-cost(p))}</b></div>`).join('')||t('none')}</div>`;
h+=`<div class="card"><h3>${t('set')}</h3><label>${t('lang')}</label><select onchange="L=D.set.lang=this.value;save();render()"><option value="ar"${L=='ar'?' selected':''}>العربية</option><option value="fr"${L=='fr'?' selected':''}>Français</option></select>
<button class="b g" onclick="bus()">${t('bus')}</button><button class="b g" onclick="form(t('pin'),[['p',t('pin'),'t',0,D.set.pin]],r=>D.set.pin=r.p)">🔒 PIN</button>
<button class="b" onclick="ex()">${t('exb')}</button><small>${t('last')}: ${D.set.last?new Date(D.set.last).toLocaleDateString():t('never')}</small><button class="b g" onclick="$('imf').click()">${t('imb')}</button><input id="imf" type="file" accept=".json" hidden onchange="im(event)"></div>`;return h};
function bus(){form(t('bus'),[['name',t('name'),'t',0,D.set.name],['phone',t('phone'),'t',0,D.set.phone],['addr',t('addr'),'t',0,D.set.addr]],r=>Object.assign(D.set,r))}
async function ex(){D.set.last=Date.now();save();const b=new Blob([JSON.stringify({v:2,d:D})],{type:'application/json'}),n='bilal-backup-'+today()+'.json',f=new File([b],n,{type:'application/json'});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return render()}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();render()}
function im(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result).d;if(confirm(t('impq')))Object.assign(D,o);else for(const k in o)if(Array.isArray(o[k])){const ids=new Set(D[k].map(x=>x.id));o[k].forEach(x=>ids.has(x.id)||D[k].push(x))}save();L=D.set.lang||L;render();alert(t('imok'))}catch(x){alert('Erreur / خطأ')}};r.readAsText(f)}
function invF(i){form(t('inv'),[['lg',t('invl'),'s',[['ar','العربية'],['fr','Français']],L]],r=>setTimeout(()=>showInv(D.projects.find(p=>p.id==i),r.lg),50))}
function showInv(p,lg){const x=k=>t(k,lg),pd=pay(p),s=D.set,e=$('inv');e.dir=lg=='ar'?'rtl':'ltr';
e.innerHTML=`<div class="np"><button class="b" onclick="window.print()">${x('print')}</button><button class="b g" onclick="$('inv').style.display='none'">${x('close')}</button></div><h2>${esc(s.name||'')}</h2><div>${esc(s.phone||'')} ${esc(s.addr||'')}</div><h3>${x('invoice')} #${p.no}</h3><p>${x('client')}: ${esc(cl(p.cid))}<br>${x('date')}: ${today()}</p>
<table><tr><th>${x('proj1')}</th><th>${x('amt')}</th></tr><tr><td>${esc(p.title)}</td><td>${money(p.price)}</td></tr></table>${D.payments.filter(y=>y.pid==p.id).map(y=>`<div>${y.date} · ${money(y.amt)}</div>`).join('')}<h3>${x('paid')}: ${money(pd)}<br>${x('left')}: ${money(p.price-pd)}</h3>`;e.style.display='block'}
function lock(){if(!D.set.pin)return;const l=$('lock');l.style.display='flex';l.innerHTML=`<div class="card"><input id="pn" type="password" inputmode="numeric" placeholder="PIN"><button class="b" onclick="if($('pn').value==D.set.pin)$('lock').style.display='none';else alert(t('wrong'))">${t('unlock')}</button></div>`}
load();L=D.set.lang||'ar';lock();render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
